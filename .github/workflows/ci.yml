name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dashboard_avance_test
          MYSQL_USER: avance
          MYSQL_PASSWORD: avance_test
          MYSQL_ROOT_PASSWORD: root_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uavance -pavance_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: dashboard_avance_test
      DB_USER: avance
      DB_PASSWORD: avance_test
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      TEST_MYSQL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:run
      - run: npm run migrate:deploy
      - run: npm run seed:reference
      - run: npm run seed:reference
